<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  [data-sleuthrail] { --bg:#0F372F; --deep:#0A2621; --surface:#143F36; --text:#F2F5F2; --muted:rgba(242,245,242,0.58); --faint:rgba(242,245,242,0.30); --accent:#ECBC6B; --onAccent:#0F372F; --line:rgba(242,245,242,0.13); --lineStrong:rgba(242,245,242,0.26); --glow:rgba(236,188,107,0.16); --accent2:var(--accent); --warn:#C89B6A; --warnBg:rgba(200,155,106,0.14); --warnBorder:rgba(200,155,106,0.42); --fHead:'Big Shoulders Display',sans-serif; --fBody:'Space Grotesk',system-ui,sans-serif; }
  [data-sleuthrail][data-theme="midnight"] { --bg:#011423; --deep:#000A12; --surface:#07202F; --text:#E8F0F6; --muted:rgba(232,240,246,0.58); --faint:rgba(232,240,246,0.30); --accent:#E7D269; --onAccent:#011423; --line:rgba(232,240,246,0.13); --lineStrong:rgba(232,240,246,0.26); --glow:rgba(231,210,105,0.14); --accent2:var(--accent); --warn:#CBA36E; --warnBg:rgba(203,163,110,0.14); --warnBorder:rgba(203,163,110,0.4); }
  [data-sleuthrail][data-type="b"] { --fHead:'Alfa Slab One',Georgia,serif; }
  [data-sleuthrail][data-theme="edition"] { --bg:#071317; --deep:#040C0F; --surface:#0C1E23; --text:#E6F2F2; --muted:rgba(230,242,242,0.58); --faint:rgba(230,242,242,0.30); --accent:#02A0A0; --onAccent:#04191B; --line:rgba(230,242,242,0.13); --lineStrong:rgba(230,242,242,0.26); --glow:rgba(2,160,160,0.20); --accent2:#FFBD65; --warn:#E3A867; --warnBg:rgba(227,168,103,0.16); --warnBorder:rgba(227,168,103,0.42); }
  [data-sleuthrail][data-theme="leaf"] { --bg:#CDFF9B; --deep:#BDF287; --surface:#D8FFB2; --text:#203D43; --muted:rgba(32,61,67,0.66); --faint:rgba(32,61,67,0.38); --accent:#203D43; --onAccent:#CDFF9B; --line:rgba(32,61,67,0.16); --lineStrong:rgba(32,61,67,0.32); --glow:rgba(32,61,67,0.16); --accent2:var(--accent); --warn:#8C6A3F; --warnBg:rgba(140,106,63,0.14); --warnBorder:rgba(140,106,63,0.34); }
  [data-sleuthrail][data-theme="ivory"] { --bg:#F3EEE1; --deep:#E7E0CF; --surface:#FBF8F1; --text:#101E28; --muted:rgba(16,30,40,0.62); --faint:rgba(16,30,40,0.34); --accent:#0061A4; --onAccent:#F7F4EC; --line:rgba(16,30,40,0.14); --lineStrong:rgba(16,30,40,0.28); --glow:rgba(0,97,164,0.12); --accent2:var(--accent); --warn:#A8703E; --warnBg:rgba(168,112,62,0.13); --warnBorder:rgba(168,112,62,0.3); }
  [data-sleuthrail] a { color: var(--accent); text-decoration: none; }
  [data-sleuthrail] a:hover { color: var(--text); }
  [data-sleuthrail] [data-tbtn][data-active="true"] { background: var(--accent) !important; color: var(--onAccent) !important; }
  [data-sleuthrail] [data-tbtn][data-active="false"]:hover { color: var(--text) !important; }
  @keyframes pulseNode { 0%,100%{opacity:.3; transform:scale(1);} 50%{opacity:1; transform:scale(1.25);} }
  [data-sleuthrail] ::-webkit-scrollbar { width: 7px; height: 7px; }
  [data-sleuthrail] ::-webkit-scrollbar-thumb { background: var(--lineStrong); border-radius: 4px; }
  [data-sleuthrail] .navitem:hover { background: var(--surface); }
  [data-sleuthrail] .navtip { opacity:0; transform:translateX(-4px); pointer-events:none; transition:opacity .18s ease, transform .18s ease; }
  [data-sleuthrail] .navitem:hover .navtip { opacity:1; transform:translateX(0); }
  [data-sleuthrail] .repo-opt:hover { background: var(--glow); }
  [data-sleuthrail] .menu-link:hover { background: var(--glow); }
  [data-sleuthrail] .hist-item:hover { background: var(--surface); }
  [data-sleuthrail] { transition: width .32s cubic-bezier(.2,.7,.2,1), transform .32s cubic-bezier(.2,.7,.2,1); }
  .rail-hamburger { display:none; }
  .rail-backdrop { display:none; }
  @media (max-width:1024px) {
    [data-sleuthrail] { position:fixed !important; top:0; left:0; z-index:80; width:272px !important; transform:translateX(-100%) !important; transition:transform .32s cubic-bezier(.2,.7,.2,1) !important; }
    [data-sleuthrail][data-mobileopen="true"] { transform:translateX(0) !important; }
    .rail-hamburger { display:flex !important; }
    .rail-backdrop[data-open="true"] { display:block !important; }
  }
</style>
</helmet>
<div style="display:contents;">

  <button type="button" class="rail-hamburger" onClick="{{ openMobileNav }}" style="position:fixed; top:18px; left:18px; z-index:75; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:9px; color:var(--text); cursor:pointer; align-items:center;" dangerouslySetInnerHTML="{{ iconMenu }}"></button>

  <div class="rail-backdrop" data-open="{{ mobileOpenStr }}" onClick="{{ closeMobileNav }}" style="position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:70;"></div>

  <nav data-sleuthrail="1" data-theme="{{ theme }}" data-type="{{ typeOpt }}" data-mobileopen="{{ mobileOpenStr }}" style="flex:none; height:100vh; width:{{ railWidth }}; background:var(--deep); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; font-family:var(--fBody); position:relative; z-index:80;">

    <div style="flex:none; display:flex; align-items:center; justify-content:{{ collapsed_v }}; padding:16px 14px; border-bottom:1px solid var(--line); gap:10px;">
      <a href="Sleuth Dashboard.dc.html" style="display:flex; align-items:center;" title="Sleuth dashboard">
        <span style="width:22px; height:22px; flex:none; border:1.5px solid var(--accent); border-radius:3px; position:relative; display:block;">
          <span style="position:absolute; inset:5px 5px auto 5px; height:1.5px; background:var(--accent); display:block;"></span>
          <span style="position:absolute; left:5px; top:11px; width:1.5px; height:6px; background:var(--accent); display:block;"></span>
          <span style="position:absolute; left:5px; top:15px; width:7px; height:1.5px; background:var(--accent); display:block;"></span>
        </span>
      </a>
      <button type="button" class="rail-hamburger" onClick="{{ closeMobileNav }}" style="background:transparent; border:0; color:var(--faint); cursor:pointer; padding:4px; margin-left:auto; align-items:center;" dangerouslySetInnerHTML="{{ iconClose }}"></button>
      <button type="button" onClick="{{ toggleCollapse }}" title="Collapse" style="background:transparent; border:0; color:var(--faint); cursor:pointer; padding:4px; display:flex; margin-left:auto;" style-hover="color:var(--text)" dangerouslySetInnerHTML="{{ iconPanelLeft }}"></button>
    </div>

<sc-if value="{{ showRepoSwitcher }}" hint-placeholder-val="{{ true }}">
    <div style="flex:none; padding:12px 12px 8px; position:relative;">
      <button type="button" onClick="{{ toggleRepoSwitcher }}" style="width:100%; display:flex; align-items:center; gap:9px; border:1px solid var(--line); border-radius:2px; padding:9px 10px; background:transparent; color:var(--text); cursor:pointer; text-align:left;" style-hover="border-color:var(--lineStrong)">
        <span style="flex:none; width:18px; height:18px; border:1px solid var(--lineStrong); border-radius:3px; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:8px; color:var(--muted);">{{ activeRepo.providerAbbr }}</span>
        <span class="lbl" style="min-width:0; max-width:{{ lblMaxWidth }}; opacity:{{ lblOpacity }}; overflow:hidden; white-space:nowrap; transition:opacity .22s ease, max-width .32s cubic-bezier(.2,.7,.2,1);">
          <span style="display:block; font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ activeRepo.name }}</span>
          <span style="display:block; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--faint); margin-top:2px;">{{ activeRepo.branch }}</span>
        </span>
        <span class="lbl" style="flex:none; margin-left:auto; color:var(--faint); display:flex; max-width:{{ lblChevMaxWidth }}; opacity:{{ lblOpacity }}; overflow:hidden; transition:opacity .22s ease, max-width .32s cubic-bezier(.2,.7,.2,1);" dangerouslySetInnerHTML="{{ iconChevronDown }}"></span>
      </button>

      <sc-if value="{{ repoSwitcherOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute; top:calc(100% + 4px); left:12px; width:280px; z-index:85; background:var(--surface); border:1px solid var(--line); box-shadow:0 20px 50px rgba(0,0,0,0.28); display:flex; flex-direction:column;">
          <div style="flex:none; padding:10px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px;">
            <span style="flex:none; color:var(--faint); display:flex;" dangerouslySetInnerHTML="{{ iconSearch }}"></span>
            <input type="text" value="{{ repoSearch }}" onChange="{{ handleRepoSearch }}" placeholder="Find a repo&#8230;" style="flex:1; background:transparent; border:0; outline:none; color:var(--text); font-family:'Space Grotesk',sans-serif; font-size:13px;" />
          </div>
          <div style="max-height:280px; overflow-y:auto; padding:6px;">
            <sc-for list="{{ repoOptions }}" as="r" hint-placeholder-count="4">
              <button type="button" class="repo-opt" onClick="{{ r.select }}" style="width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; text-align:left; background:transparent; border:0; padding:9px 10px; border-radius:2px; cursor:pointer; color:var(--text);">
                <span style="min-width:0;">
                  <span style="display:block; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ r.name }}</span>
                  <span style="display:block; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--faint); margin-top:2px;">{{ r.branch }}</span>
                </span>
                <span style="flex:none;" dangerouslySetInnerHTML="{{ r.pillHtml }}"></span>
              </button>
            </sc-for>
            <sc-if value="{{ noRepoResults }}" hint-placeholder-val="{{ false }}">
              <div style="padding:16px 10px; text-align:center; color:var(--faint); font-size:12.5px;">No repositories match.</div>
            </sc-if>
          </div>
        </div>
      </sc-if>
    </div>
    </sc-if>

    <div style="flex:none; padding:6px 8px; display:flex; flex-direction:column; gap:2px;">
      <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="4">
        <a href="{{ item.href }}" class="navitem" style="display:flex; align-items:center; gap:12px; padding:10px 10px; border-left:2px solid {{ item.borderColor }}; color:{{ item.color }}; font-weight:{{ item.weight }}; font-size:14px; position:relative; text-decoration:none;">
          <span style="flex:none; width:18px; height:18px; display:flex; align-items:center; justify-content:center; position:relative;" dangerouslySetInnerHTML="{{ item.icon }}"></span>
          <sc-if value="{{ item.showDot }}" hint-placeholder-val="{{ false }}">
            <span style="position:absolute; left:20px; top:9px; width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulseNode 1.4s ease-in-out infinite; box-shadow:0 0 0 2px var(--deep);"></span>
          </sc-if>
          <span class="lbl" style="max-width:{{ lblMaxWidth }}; opacity:{{ lblOpacity }}; overflow:hidden; white-space:nowrap; transition:opacity .22s ease, max-width .32s cubic-bezier(.2,.7,.2,1);">{{ item.label }}</span>
          <sc-if value="{{ item.collapsedTip }}" hint-placeholder-val="{{ false }}">
            <span class="navtip" style="position:absolute; left:calc(100% + 10px); top:50%; transform:translateY(-50%); background:var(--surface); border:1px solid var(--line); color:var(--text); font-size:12.5px; font-weight:500; padding:6px 10px; border-radius:2px; white-space:nowrap; box-shadow:0 10px 26px rgba(0,0,0,0.28); z-index:95;">{{ item.label }}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>

    <sc-if value="{{ showHistory }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:10px 8px 8px; border-top:1px solid var(--line); margin-top:6px;">
        <sc-for list="{{ historyGroups }}" as="grp" hint-placeholder-count="2">
          <div style="margin-bottom:12px;">
            <div style="font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--faint); padding:6px 8px 4px;">{{ grp.label }}</div>
            <sc-for list="{{ grp.items }}" as="c" hint-placeholder-count="2">
              <div class="hist-item" style="display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:7px 8px; border-radius:2px; cursor:pointer; min-width:0;">
                <span style="font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1;">{{ c.title }}</span>
                <span style="flex:none; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--faint);">{{ c.time }}</span>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ showHistorySpacer }}" hint-placeholder-val="{{ true }}">
      <div style="flex:1;"></div>
    </sc-if>

    <div style="flex:none; border-top:1px solid var(--line); padding:10px; position:relative;">
      <button type="button" onClick="{{ toggleAccountMenu }}" style="width:100%; display:flex; align-items:center; gap:10px; background:transparent; border:0; padding:6px; cursor:pointer; color:var(--text); text-align:left;" style-hover="background:var(--surface)">
        <span style="flex:none; width:28px; height:28px; border-radius:50%; background:var(--accent); color:var(--onAccent); font-family:var(--fHead); font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center;">JE</span>
        <span class="lbl" style="min-width:0; max-width:{{ lblMaxWidth }}; opacity:{{ lblOpacity }}; overflow:hidden; white-space:nowrap; transition:opacity .22s ease, max-width .32s cubic-bezier(.2,.7,.2,1);">
          <span style="display:block; font-size:13px; font-weight:600; white-space:nowrap;">Jordan Ellis</span>
        </span>
        <span class="lbl" style="flex:none; margin-left:auto; color:var(--faint); display:flex; max-width:{{ lblChevMaxWidth }}; opacity:{{ lblOpacity }}; overflow:hidden; transition:opacity .22s ease, max-width .32s cubic-bezier(.2,.7,.2,1);" dangerouslySetInnerHTML="{{ iconChevronDown }}"></span>
      </button>

      <sc-if value="{{ accountMenuOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute; bottom:calc(100% + 6px); left:10px; right:10px; z-index:85; background:var(--surface); border:1px solid var(--line); box-shadow:0 20px 50px rgba(0,0,0,0.28); padding:6px; display:flex; flex-direction:column;">
          <a href="#" class="menu-link" style="padding:9px 10px; font-size:13px; color:var(--text); border-radius:2px;">Account settings</a>
          <div style="padding:9px 10px;">
            <div style="font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--faint); margin-bottom:7px;">Theme</div>
            <div style="display:flex; flex-wrap:wrap; gap:5px;">
              <sc-for list="{{ themeOptions }}" as="th" hint-placeholder-count="5">
                <button type="button" data-tbtn="{{ th.key }}" data-active="{{ th.active }}" onClick="{{ th.select }}" style="font-family:'Space Grotesk',sans-serif; font-size:10.5px; padding:5px 9px; border:1px solid var(--line); border-radius:999px; background:{{ th.bg }}; color:{{ th.color }}; cursor:pointer;">{{ th.label }}</button>
              </sc-for>
            </div>
          </div>
          <div style="height:1px; background:var(--line); margin:4px 4px;"></div>
          <sc-if value="{{ showLogoutLink }}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{ requestLogout }}" class="menu-link" style="text-align:left; width:100%; background:transparent; border:0; padding:9px 10px; font-size:13px; color:var(--muted); border-radius:2px; cursor:pointer;">Log out</button>
          </sc-if>
          <sc-if value="{{ logoutConfirm }}" hint-placeholder-val="{{ false }}">
            <div style="padding:9px 10px 4px;">
              <div style="font-size:13px; font-weight:600; margin-bottom:10px;">Log out of Sleuth?</div>
              <div style="display:flex; gap:8px;">
                <button type="button" onClick="{{ cancelLogout }}" style="flex:1; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--text); font-size:12.5px; padding:8px 0; border-radius:2px;">Cancel</button>
                <button type="button" onClick="{{ confirmLogout }}" style="flex:1; cursor:pointer; border:0; background:var(--accent); color:var(--onAccent); font-size:12.5px; font-weight:600; padding:8px 0; border-radius:2px;">Log out</button>
              </div>
            </div>
          </sc-if>
        </div>
      </sc-if>
    </div>
  </nav>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:272,&quot;height&quot;:800},&quot;theme&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;storm&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;typeOption&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;a&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;activePage&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;chat&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;indexingActive&quot;:{&quot;editor&quot;:null,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onSetTheme&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(t: string) =&gt; void&quot;}}">
const ICONS = {
  chevronDown: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  panelLeft: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M9 4v16" /></svg>',
  search: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20" stroke-linecap="round"/></svg>',
  close: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>',
  menu: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>',
  chat: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16v11H9l-5 4V5z" stroke-linejoin="round"/></svg>',
  repos: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h6l2 3h8v13H4z" stroke-linejoin="round"/></svg>',
  indexing: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h11M4 18h7" stroke-linecap="round"/></svg>',
  settings: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M4.5 7.5l2.4 1.4M17.1 15.1l2.4 1.4M4.5 16.5l2.4-1.4M17.1 8.9l2.4-1.4" stroke-linecap="round"/></svg>'
};
const PROVIDER_ABBR = { github: 'GH', gitlab: 'GL', bitbucket: 'BB' };
const REPOS = [
  { id: 'r1', name: 'acme/platform', provider: 'github', branch: 'main', status: 'indexed' },
  { id: 'r2', name: 'acme/mobile-app', provider: 'gitlab', branch: 'develop', status: 'indexing' },
  { id: 'r3', name: 'acme/infra', provider: 'bitbucket', branch: 'main', status: 'attention' },
  { id: 'r4', name: 'acme/docs-site', provider: 'github', branch: 'main', status: 'none' },
  { id: 'r5', name: 'acme/billing-service', provider: 'github', branch: 'main', status: 'indexed' },
  { id: 'r6', name: 'acme/data-pipeline', provider: 'gitlab', branch: 'main', status: 'indexed' }
];
const HISTORY = [
  { label: 'Today', items: [
    { title: 'How does session invalidation work?', time: '2h' },
    { title: 'Where do we handle Stripe webhook retries?', time: '5h' }
  ] },
  { label: 'This week', items: [
    { title: 'What owns the feature-flag rollout logic?', time: 'Mon' },
    { title: 'How is the onboarding funnel tracked?', time: 'Sun' }
  ] },
  { label: 'Older', items: [
    { title: 'Why does the CI cache miss on monorepo builds?', time: 'Aug 3' }
  ] }
];
const PAGES = [
  { id: 'chat', label: 'Chat', href: 'Sleuth Chat.dc.html', icon: ICONS.chat },
  { id: 'repos', label: 'Repos', href: 'Sleuth Dashboard.dc.html', icon: ICONS.repos },
  { id: 'indexing', label: 'Indexing status', href: 'Sleuth Indexing Status.dc.html', icon: ICONS.indexing },
  { id: 'settings', label: 'Settings', href: 'Sleuth Repo Settings.dc.html', icon: ICONS.settings }
];
const THEMES = ['storm', 'midnight', 'ivory', 'leaf', 'edition'];

function statusPillHtml(status) {
  if (status === 'indexed') return '<span style="display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--onAccent);font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap;">Indexed</span>';
  if (status === 'indexing') return '<span style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--lineStrong);color:var(--accent);font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap;"><span style="width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulseNode 1.4s ease-in-out infinite;"></span>Indexing</span>';
  if (status === 'attention') return '<span style="display:inline-flex;align-items:center;gap:6px;background:var(--warnBg);border:1px solid var(--warnBorder);color:var(--warn);font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap;">Failed</span>';
  return '<span style="display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);color:var(--faint);font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap;">Not indexed</span>';
}

class Component extends DCLogic {
  state = {
    collapsed: false, mobileOpen: false,
    repoSwitcherOpen: false, repoSearch: '', activeRepoId: 'r1',
    accountMenuOpen: false, logoutConfirm: false
  };

  toggleCollapse = () => this.setState(s => ({ collapsed: !s.collapsed, repoSwitcherOpen: false, accountMenuOpen: false }));
  openMobileNav = () => this.setState({ mobileOpen: true });
  closeMobileNav = () => this.setState({ mobileOpen: false, repoSwitcherOpen: false, accountMenuOpen: false });
  toggleRepoSwitcher = () => this.setState(s => ({ repoSwitcherOpen: !s.repoSwitcherOpen, accountMenuOpen: false }));
  toggleAccountMenu = () => this.setState(s => ({ accountMenuOpen: !s.accountMenuOpen, repoSwitcherOpen: false, logoutConfirm: false }));
  selectRepo(id) { this.setState({ activeRepoId: id, repoSwitcherOpen: false }); }
  handleRepoSearch = (e) => this.setState({ repoSearch: e.target.value });
  requestLogout = () => this.setState({ logoutConfirm: true });
  cancelLogout = () => this.setState({ logoutConfirm: false });
  confirmLogout = () => {
    document.body.style.transition = 'opacity .5s ease';
    document.body.style.opacity = '0';
    setTimeout(() => { window.location.href = 'Sleuth Login.dc.html'; }, 500);
  };

  renderVals() {
    const s = this.state;
    const theme = this.props.theme || 'storm';
    const typeOpt = this.props.typeOption || this.props.typeOpt || 'a';
    const activePage = this.props.activePage || 'chat';
    const indexingActive = this.props.indexingActive !== false;
    const collapsed = s.collapsed;
    const showRepoSwitcher = !this.props.hideRepoSwitcher;
    const hideHistory = !!this.props.hideHistory;

    const activeRepo = REPOS.find(r => r.id === s.activeRepoId) || REPOS[0];
    const q = s.repoSearch.trim().toLowerCase();
    const repoOptions = REPOS.filter(r => r.id !== s.activeRepoId && (!q || r.name.toLowerCase().includes(q))).map(r => ({
      key: r.id, name: r.name, branch: r.branch,
      pillHtml: { __html: statusPillHtml(r.status) },
      select: () => this.selectRepo(r.id)
    }));

    const navItems = PAGES.map(n => {
      const active = activePage === n.id;
      return {
        key: n.id, label: n.label, href: n.href,
        icon: { __html: n.icon },
        showDot: n.id === 'indexing' && indexingActive,
        borderColor: active ? 'var(--accent)' : 'transparent',
        color: active ? 'var(--text)' : 'var(--muted)',
        weight: active ? '600' : '400',
        collapsedTip: collapsed
      };
    });

    const historyGroups = HISTORY.map(g => ({ key: g.label, label: g.label, items: g.items.map((it, i) => ({ key: g.label + i, title: it.title, time: it.time })) }));

    const onSetTheme = this.props.onSetTheme || (() => {});
    const themeOptions = THEMES.map(name => ({
      key: name, label: name[0].toUpperCase() + name.slice(1),
      active: String(theme === name),
      bg: theme === name ? 'var(--accent)' : 'transparent',
      color: theme === name ? 'var(--onAccent)' : 'var(--faint)',
      select: () => onSetTheme(name)
    }));

    return {
      theme, typeOpt,
      collapsed_v: collapsed ? 'center' : 'flex-start',
      railWidth: collapsed ? '72px' : '272px',
      mobileOpenStr: String(s.mobileOpen),
      openMobileNav: this.openMobileNav,
      closeMobileNav: this.closeMobileNav,
      toggleCollapse: this.toggleCollapse,

      lblMaxWidth: collapsed ? '0px' : '180px',
      lblChevMaxWidth: collapsed ? '0px' : '20px',
      lblOpacity: collapsed ? '0' : '1',

      activeRepo: { ...activeRepo, providerAbbr: PROVIDER_ABBR[activeRepo.provider] || '?' },
      repoSwitcherOpen: s.repoSwitcherOpen,
      toggleRepoSwitcher: this.toggleRepoSwitcher,
      repoSearch: s.repoSearch,
      handleRepoSearch: this.handleRepoSearch,
      repoOptions,
      noRepoResults: repoOptions.length === 0,

      navItems,
      showRepoSwitcher,
      showHistory: activePage === 'chat' && !collapsed && !hideHistory,
      showHistorySpacer: !(activePage === 'chat' && !collapsed && !hideHistory),
      historyGroups,

      accountMenuOpen: s.accountMenuOpen,
      toggleAccountMenu: this.toggleAccountMenu,
      themeOptions,
      logoutConfirm: s.logoutConfirm,
      showLogoutLink: !s.logoutConfirm,
      requestLogout: this.requestLogout,
      cancelLogout: this.cancelLogout,
      confirmLogout: this.confirmLogout,

      iconChevronDown: { __html: ICONS.chevronDown },
      iconPanelLeft: { __html: ICONS.panelLeft },
      iconSearch: { __html: ICONS.search },
      iconClose: { __html: ICONS.close },
      iconMenu: { __html: ICONS.menu }
    };
  }
}

</script>
</body>
</html>
